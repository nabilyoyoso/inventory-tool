name: Inventory Sync

on:
  # Runs automatically roughly every 30 minutes. GitHub does not guarantee
  # exact timing, but at this interval it reliably runs close to on schedule
  # (the multi-hour delays we saw before only happen with much more frequent,
  # sub-hourly schedules under GitHub's load).
  schedule:
    - cron: '*/30 * * * *'

  # Lets the relay service (and therefore the Refresh button on the report
  # page) trigger a sync immediately, on demand, via GitHub's API.
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run inventory sync
        env:
          ERP_CONNECTION_STRING: ${{ secrets.ERP_CONNECTION_STRING }}
          SUPABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: dotnet run --project InventorySync.csproj -c Release
