name: Inventory Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique ID supplied by the Sync/Reload relay'
        required: false
        type: string

run-name: Inventory Sync${{ inputs.request_id && format(' - {0}', inputs.request_id) || '' }}

# One workflow run at a time. This protects the shared PostgreSQL staging
# tables even when a scheduled run and a manual Refresh happen together.
concurrency:
  group: inventory-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run inventory sync
        env:
          ERP_CONNECTION_STRING: ${{ secrets.ERP_CONNECTION_STRING }}
          SUPABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
          # Re-read the most recent 30 days on every incremental sync. This
          # catches ordinary late/backdated ERP entries and corrections without
          # reverting to a full historical reload.
          SYNC_OVERLAP_DAYS: '30'
          ERP_COMMAND_TIMEOUT_SECONDS: '300'
        run: dotnet run --project InventorySync.csproj -c Release

  # ============================================================================
  # SCHEMA SNAPSHOT + REAL SCHEMA BACKUP
  #
  # schema.sql remains the compact generated mirror used for code review.
  # database_schema.sql is a real pg_dump schema backup containing public
  # tables, views, functions, RLS policies and grants. It contains no business
  # data, but it is suitable as the structural restore source.
  # ============================================================================
  schema-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure PostgreSQL 17 client tools are available
        # BUGFIX (2026-08-16): the GitHub-hosted runner ships with
        # postgresql-client pre-installed (currently 16.14), so the old
        # "install only if missing" check here never fired — `command -v
        # pg_dump` already succeeded. pg_dump refuses to dump from a server
        # whose major version is newer than its own, which is exactly what
        # failed: "server version: 17.6; pg_dump version: 16.14". This adds
        # the official PGDG apt repository and installs postgresql-client-17
        # explicitly and unconditionally, then puts its bin directory first
        # on PATH so every later step's `psql`/`pg_dump` resolves to v17.
        # If Supabase is ever upgraded past major version 17, bump the "17"
        # below to match.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget -q -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify psql/pg_dump resolve to PostgreSQL 17
        run: |
          psql --version
          pg_dump --version

      - name: Sync checkout with current main before dumping
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Dump compact schema mirror
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -X -q -A -t -f scripts/dump_schema.sql -o schema.sql

      - name: Dump complete public schema backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$SUPABASE_DB_URL"             --schema-only             --schema=public             --no-owner             --clean             --if-exists             --file=database_schema.sql

      - name: Commit schema files safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Main changed while preparing the schema commit; retrying."
              sleep $((attempt * 2))
              continue
            fi

            git add schema.sql database_schema.sql

            if git diff --cached --quiet; then
              echo "Schema files unchanged — nothing to commit."
              exit 0
            fi

            git commit -m "chore: auto-sync Supabase schema [skip ci]"

            if git push origin HEAD:main; then
              echo "Schema files committed successfully."
              exit 0
            fi

            echo "Push race detected; retrying after refreshing main (attempt $attempt/5)."
            git reset --hard origin/main
            sleep $((attempt * 2))
          done

          echo "Could not safely publish the schema snapshot after 5 attempts."
          exit 1
