<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Report</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  :root {
    --ink: #1C1E22;
    --paper: #F7F5F0;
    --panel: #FFFFFF;
    --line: #DDD8CC;
    --amber: #C98A3E;
    --amber-dark: #A66F2E;
    --teal: #3F6E64;
    --danger: #B4442E;
    --muted: #6B6A63;
    --radius: 6px;
    --success-fg: #4ADE94;
    --success-bg: rgba(20, 46, 34, 0.92);
    --error-fg: #FF8A73;
    --error-bg: rgba(52, 20, 18, 0.92);
    --neutral-fg: var(--amber);
    --neutral-bg: rgba(28, 30, 34, 0.92);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .barcode-stripe {
    height: 10px; width: 100%;
    background-image: repeating-linear-gradient(90deg,
      var(--ink) 0px, var(--ink) 2px, transparent 2px, transparent 5px,
      var(--ink) 5px, var(--ink) 6px, transparent 6px, transparent 11px,
      var(--ink) 11px, var(--ink) 14px, transparent 14px, transparent 17px);
    opacity: 0.85;
  }
  .barcode-stripe.loading { animation: stripe-scan 1.1s linear infinite; background-size: 200% 100%; }
  @keyframes stripe-scan { 0% { background-position: 0% 0; } 100% { background-position: -60px 0; } }
  @media (prefers-reduced-motion: reduce) { .barcode-stripe.loading { animation: none; } }

  header { background: var(--ink); color: var(--paper); padding: 22px clamp(16px, 4vw, 48px) 18px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; }
  header .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); margin: 0 0 6px; }
  header h1 { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: clamp(22px, 4vw, 30px); letter-spacing: 0.01em; margin: 0; text-transform: uppercase; }

  .header-right { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }

  /* ---- Sync info panel ---- */
  .sync-panel { display:flex; align-items:center; gap:10px; padding: 7px 14px 7px 8px; border-radius: 999px; font-family:'IBM Plex Mono', monospace; font-size: 11.5px; }
  .sync-pill { display:flex; align-items:center; gap:6px; padding: 5px 12px; border-radius: 999px; font-weight:600; letter-spacing:0.03em; }
  .sync-pill .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .sync-pill.success { background: var(--success-bg); color: var(--success-fg); }
  .sync-pill.error { background: var(--error-bg); color: var(--error-fg); }
  .sync-pill.neutral { background: var(--neutral-bg); color: var(--neutral-fg); }
  .sync-pill.syncing .dot { animation: pulse-dot 1s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .sync-meta { color:#B9B5A8; white-space:nowrap; }
  .sync-meta strong { color: var(--paper); font-weight:500; }

  .toast { position: fixed; bottom: 24px; right: 24px; max-width: 340px; padding: 14px 18px; border-radius: var(--radius); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 1000; animation: toast-in 0.2s ease-out; }
  .toast.success { background: var(--teal); color: white; }
  .toast.error { background: var(--danger); color: white; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  main { max-width: 1600px; margin: 0 auto; padding: clamp(16px, 4vw, 40px); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(16px, 3vw, 28px); margin-bottom: 20px; }
  .panel h2 { font-family:'Oswald', sans-serif; font-size:15px; text-transform:uppercase; letter-spacing:0.04em; margin: 0 0 16px; color: var(--ink); }

  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; align-items: end; }
  .field label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }

  /* ---- Modern date picker ---- */
  .date-field { position: relative; }
  .date-field input[type="date"] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper); color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 14px;
    appearance: none; -webkit-appearance: none;
  }
  .date-field input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(38%) sepia(45%) saturate(600%) hue-rotate(350deg) brightness(95%);
    cursor: pointer; padding: 2px;
  }
  .date-field input[type="date"]:focus { outline: 2px solid var(--amber); outline-offset: 1px; }

  /* ---- Custom dropdown (single & multi select) ---- */
  .dd { position: relative; }
  .dd-toggle {
    width: 100%; text-align:left; padding: 10px 34px 10px 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; cursor: pointer;
    position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dd-toggle::after {
    content: ''; position: absolute; right: 12px; top: 50%; width: 8px; height: 8px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg); transition: transform 0.15s;
  }
  .dd.open .dd-toggle::after { transform: translateY(-30%) rotate(-135deg); }
  .dd-toggle:focus-visible, .dd-toggle:hover { outline: 2px solid var(--amber); outline-offset: 1px; }
  .dd-panel {
    display:none; position:absolute; top: calc(100% + 6px); left:0; right:0; z-index: 40;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 10px 28px rgba(20,20,15,0.16); overflow: hidden;
  }
  .dd.open .dd-panel { display:block; }
  .dd-search { border-bottom: 1px solid var(--line); padding: 8px; }
  .dd-search input { width:100%; padding: 8px 10px; border:1px solid var(--line); border-radius:4px; font-family:'Inter',sans-serif; font-size:13px; }
  .dd-search input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
  .dd-list { max-height: 240px; overflow-y: auto; }
  .dd-option { display:flex; align-items:center; gap:9px; padding: 9px 12px; font-size: 13.5px; cursor:pointer; }
  .dd-option:hover { background: #FBF9F4; }
  .dd-option.all { border-bottom: 1px solid var(--line); font-weight: 600; }
  .dd-option input[type="checkbox"], .dd-option .radio-dot { accent-color: var(--amber); flex-shrink:0; }
  .dd-option .radio-dot { width:14px; height:14px; border-radius:50%; border:1.5px solid var(--muted); display:inline-block; position:relative; }
  .dd-option.selected .radio-dot { border-color: var(--amber); }
  .dd-option.selected .radio-dot::after { content:''; position:absolute; inset:2.5px; border-radius:50%; background:var(--amber); }
  .dd-empty { padding: 14px 12px; color: var(--muted); font-size: 13px; }

  .report-toggle { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .report-toggle button { flex: 1; padding: 10px 8px; border: none; background: var(--paper); color: var(--muted); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; cursor: pointer; }
  .report-toggle button.active { background: var(--ink); color: var(--paper); }
  .report-toggle button:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }

  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; align-items:center; }
  button.primary, button.secondary { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; padding: 11px 20px; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent; }
  button.primary { background: var(--amber); color: var(--ink); border-color: var(--amber); }
  button.primary:hover { background: var(--amber-dark); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
  button.secondary:hover { background: var(--ink); color: var(--paper); }
  button.secondary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.header-btn { background: transparent; color: var(--paper); border-color: var(--paper); font-size:12.5px; padding: 8px 16px; }
  button.header-btn:hover { background: var(--paper); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .status-line { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--muted); margin: 14px 0 0; }
  .status-line.error { color: var(--danger); }

  /* ---- Barcode search module ---- */
  .search-row { display:flex; gap:10px; }
  .search-row input { flex:1; padding: 11px 14px; border:1px solid var(--line); border-radius: var(--radius); font-family:'IBM Plex Mono', monospace; font-size: 14px; background: var(--paper); }
  .search-row input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }

  .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); max-height: 560px; }
  table { border-collapse: collapse; width: 100%; min-width: 900px; }
  thead th { text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); background: var(--paper); border-bottom: 2px solid var(--ink); padding: 10px 12px; white-space: nowrap; position: sticky; top: 0; z-index: 5; }
  thead th.num { text-align: right; }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
  tbody td.num { text-align: right; font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: #FBF9F4; }
  tbody tr:last-child td { border-bottom: none; }

  .empty-state, .initial-state { padding: 48px 24px; text-align: center; color: var(--muted); }
  .empty-state .headline, .initial-state .headline { font-family: 'Oswald', sans-serif; font-size: 18px; color: var(--ink); text-transform: uppercase; margin-bottom: 6px; }

  footer { text-align: center; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; padding: 28px 16px 40px; }

  @media print {
    header, .panel .filters, .actions, footer, .barcode-stripe, #searchPanel { display: none !important; }
    .panel { border: none; padding: 0; }
    .table-wrap { max-height: none; overflow: visible; }
    body { background: white; }
  }

  #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--ink); padding: 20px; }
  .login-card { background: var(--panel); border-radius: var(--radius); padding: 36px 32px; width: 100%; max-width: 360px; }
  .login-card .field label { display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:7px; }
  .login-card input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); font-family:'Inter',sans-serif; font-size:14px; }
  .login-card input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <p class="eyebrow" style="color:var(--amber)">Inventory Reporting</p>
    <h1 style="font-family:'Oswald',sans-serif; text-transform:uppercase; margin:0 0 20px;">Sign in</h1>
    <div class="field" style="margin-bottom:14px;">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="username">
    </div>
    <div class="field" style="margin-bottom:18px;">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button type="button" class="primary" id="btnLogin" style="width:100%;">Sign in</button>
    <p class="status-line" id="loginStatus" style="text-align:center;"></p>
  </div>
</div>

<div id="appContent" style="display:none;">

<header>
  <div>
    <p class="eyebrow">Inventory Reporting</p>
    <h1>Stock Report</h1>
  </div>
  <div class="header-right">
    <div class="sync-panel">
      <span class="sync-pill neutral" id="syncPill"><span class="dot"></span><span id="syncPillText">Checking…</span></span>
      <span class="sync-meta" id="syncMeta">Last update: —</span>
    </div>
    <button type="button" class="secondary header-btn" id="btnRefreshSync">Sync / Reload</button>
    <button type="button" class="secondary header-btn" id="btnLogout">Sign out</button>
  </div>
</header>
<div class="barcode-stripe" id="stripe"></div>

<main>
  <section class="panel">
    <div class="filters">
      <div class="field date-field">
        <label for="asOfDate">Stock as of date</label>
        <input type="date" id="asOfDate">
      </div>

      <div class="field">
        <label id="storeLabel">Select store</label>
        <div class="dd" id="ddStore"></div>
      </div>

      <div class="field">
        <label id="categoryLabel">Category</label>
        <div class="dd" id="ddCategory"></div>
      </div>

      <div class="field">
        <label id="subCategoryLabel">Sub-Category</label>
        <div class="dd" id="ddSubCategory"></div>
      </div>

      <div class="field">
        <label>Report type</label>
        <div class="report-toggle" role="group" aria-label="Report type">
          <button type="button" id="btnStore" class="active">Store Wise</button>
          <button type="button" id="btnBarcode">Barcode Wise</button>
          <button type="button" id="btnSaleBarcode">Sale_Barcode Wise</button>
        </div>
      </div>

      <div class="field">
        <label>Print type</label>
        <div class="report-toggle" role="group" aria-label="Print type">
          <button type="button" id="btnPrintTypeExcel" class="active">Excel</button>
          <button type="button" id="btnPrintTypePdf">PDF View</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="primary" id="btnGenerate">Generate report</button>
      <button type="button" class="secondary" id="btnExport" disabled>Export</button>
    </div>

    <p class="status-line" id="statusLine">Pick a date and store, then generate a report.</p>
  </section>

  <section class="panel" id="searchPanel">
    <h2>Barcode search</h2>
    <div class="search-row">
      <input type="text" id="barcodeSearch" placeholder="Search by Barcode, Sale Barcode, or User Barcode…">
      <button type="button" class="secondary" id="btnSearchClear">Clear</button>
    </div>
    <p class="status-line" id="searchStatusLine"></p>
    <div id="searchResultsArea"></div>
  </section>

  <section class="panel" style="padding:0; overflow:hidden;">
    <div id="resultsArea">
      <div class="initial-state">
        <div class="headline">No report yet</div>
        <div>Set your filters above and click Generate report.</div>
      </div>
    </div>
  </section>
</main>

</div><!-- /#appContent -->

<script>
(function() {
/* =====================================================================
   CONFIG — fill in your Supabase project URL and anon public key below.
   ===================================================================== */
const SUPABASE_URL = 'https://pqaxhpfrrwqshqsretvo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxYXhocGZycndxc2hxc3JldHZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNjI4MjYsImV4cCI6MjEwMDYzODgyNn0.Nc5l-Di2CFZWx5lyImvFn5-odC4GTfabKg5k_t_WbI0';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    storage: window.sessionStorage,
    persistSession: true,
    autoRefreshToken: true,
  },
});

// ---- Authentication gate ----
const loginEls = {
  screen: document.getElementById('loginScreen'),
  app: document.getElementById('appContent'),
  email: document.getElementById('loginEmail'),
  password: document.getElementById('loginPassword'),
  btnLogin: document.getElementById('btnLogin'),
  status: document.getElementById('loginStatus'),
};

async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    showApp();
  } else {
    loginEls.screen.style.display = 'flex';
    loginEls.app.style.display = 'none';
  }
}

function showApp() {
  loginEls.screen.style.display = 'none';
  loginEls.app.style.display = 'block';
  loadStores();
  loadCategories();
  loadSyncStatus();
}

// ---- Sync / Reload button + sync info panel ----
const SYNC_TRIGGER_URL = 'https://inventory-sync-service.onrender.com/trigger-sync';
const SYNC_STATUS_URL = 'https://inventory-sync-service.onrender.com/sync-status';

document.getElementById('btnRefreshSync').addEventListener('click', async () => {
  const btn = document.getElementById('btnRefreshSync');
  btn.disabled = true;
  btn.textContent = 'Starting…';

  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { showToast('You need to be signed in to sync.', 'error'); btn.disabled = false; btn.textContent = 'Sync / Reload'; return; }

    const resp = await fetch(SYNC_TRIGGER_URL, {
      headers: { Authorization: `Bearer ${session.access_token}` },
    });

    if (resp.status !== 202) {
      const text = await resp.text();
      showToast('Could not start sync — check with your admin.', 'error');
      console.error('Sync start failure detail:', text);
      btn.disabled = false;
      btn.textContent = 'Sync / Reload';
      return;
    }

    showToast('Sync running in the background — this can take a few minutes…', 'success', 4000);
    btn.textContent = 'Syncing…';
    setSyncPill('syncing');
    await pollSyncStatus(btn);
  } catch (err) {
    showToast('Could not reach the sync service: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Sync / Reload';
  }
});

async function pollSyncStatus(btn) {
  const maxWaitMs = 10 * 60 * 1000;
  const intervalMs = 4000;
  const startedAt = Date.now();

  while (Date.now() - startedAt < maxWaitMs) {
    await new Promise(r => setTimeout(r, intervalMs));

    let status;
    try {
      const resp = await fetch(SYNC_STATUS_URL);
      status = await resp.json();
    } catch {
      continue;
    }

    if (!status.isRunning) {
      applySyncStatus(status);
      if (status.lastSuccess === true) {
        showToast('Sync completed successfully — data is up to date.', 'success');
      } else {
        showToast('Sync finished with errors — no data was changed. Check the Actions tab on GitHub for details.', 'error');
      }
      btn.disabled = false;
      btn.textContent = 'Sync / Reload';
      return;
    }
  }

  showToast('Still running — check back in a bit. This will finish on its own.', 'error');
  btn.disabled = false;
  btn.textContent = 'Sync / Reload';
}

async function loadSyncStatus() {
  try {
    const resp = await fetch(SYNC_STATUS_URL);
    const status = await resp.json();
    applySyncStatus(status);
  } catch {
    setSyncPill('neutral', 'Status unavailable');
  }
}
setInterval(loadSyncStatus, 60000);

function applySyncStatus(status) {
  const meta = document.getElementById('syncMeta');
  if (status.isRunning) {
    setSyncPill('syncing');
  } else if (status.lastSuccess === true) {
    setSyncPill('success', 'Successful');
  } else if (status.lastSuccess === false) {
    setSyncPill('error', 'Error');
  } else {
    setSyncPill('neutral', 'No sync yet');
  }
  meta.innerHTML = status.lastFinishedAt
    ? `Last update: <strong>${formatSyncDate(new Date(status.lastFinishedAt))}</strong>`
    : 'Last update: —';
}

function setSyncPill(kind, label) {
  const pill = document.getElementById('syncPill');
  const text = document.getElementById('syncPillText');
  pill.className = 'sync-pill ' + (kind === 'syncing' ? 'neutral syncing' : kind);
  text.textContent = kind === 'syncing' ? 'Syncing…' : (label || '');
}

function formatSyncDate(d) {
  const day = String(d.getDate()).padStart(2, '0');
  const month = d.toLocaleString('en-US', { month: 'short' });
  const year = String(d.getFullYear()).slice(-2);
  let hours = d.getHours();
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12; if (hours === 0) hours = 12;
  const mins = String(d.getMinutes()).padStart(2, '0');
  return `${day}-${month}-${year} | ${String(hours).padStart(2, '0')}:${mins} ${ampm}`;
}

function showToast(message, type, durationMs = 5000) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), durationMs);
}

loginEls.btnLogin.addEventListener('click', doLogin);
loginEls.password.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  loginEls.status.textContent = 'Signing in…';
  loginEls.status.classList.remove('error');
  const { error } = await supabase.auth.signInWithPassword({
    email: loginEls.email.value.trim(),
    password: loginEls.password.value,
  });
  if (error) {
    loginEls.status.textContent = 'Sign in failed: ' + error.message;
    loginEls.status.classList.add('error');
    return;
  }
  showApp();
}

document.getElementById('btnLogout').addEventListener('click', async () => {
  await supabase.auth.signOut();
  location.reload();
});

checkAuth();

// ============================================================================
// CUSTOM DROPDOWN COMPONENT — used for Store (single-select) and
// Category / Sub-Category (multi-select). Opens below, searchable.
// ============================================================================
function createDropdown({ mountEl, placeholder, allLabel, multi }) {
  let options = [];      // [{value, label}]
  let selected = multi ? [] : null; // array of values (multi) or single value/null (single = "all")
  let onChangeCb = () => {};

  mountEl.innerHTML = `
    <button type="button" class="dd-toggle">${placeholder}</button>
    <div class="dd-panel">
      <div class="dd-search"><input type="text" placeholder="Search…"></div>
      <div class="dd-list"></div>
    </div>
  `;
  const toggle = mountEl.querySelector('.dd-toggle');
  const panel = mountEl.querySelector('.dd-panel');
  const searchInput = mountEl.querySelector('.dd-search input');
  const list = mountEl.querySelector('.dd-list');

  toggle.addEventListener('click', () => {
    const isOpen = mountEl.classList.contains('open');
    closeAllDropdowns();
    if (!isOpen) { mountEl.classList.add('open'); searchInput.value = ''; renderList(); searchInput.focus(); }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && mountEl.classList.contains('open')) mountEl.classList.remove('open');
  });

  searchInput.addEventListener('input', renderList);

  function renderList() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = q ? options.filter(o => o.label.toLowerCase().includes(q)) : options;

    let html = `<div class="dd-option all ${(multi ? selected.length === 0 : selected === null) ? 'selected' : ''}" data-all="1">
      ${multi ? '<input type="checkbox">' : '<span class="radio-dot"></span>'}<span>${allLabel}</span></div>`;

    if (filtered.length === 0) {
      html += `<div class="dd-empty">No matches.</div>`;
    } else {
      for (const o of filtered) {
        const isSel = multi ? selected.includes(o.value) : selected === o.value;
        html += `<div class="dd-option ${isSel ? 'selected' : ''}" data-value="${o.value}">
          ${multi ? `<input type="checkbox" ${isSel ? 'checked' : ''}>` : `<span class="radio-dot"></span>`}<span>${o.label}</span></div>`;
      }
    }
    list.innerHTML = html;

    list.querySelectorAll('.dd-option').forEach(row => {
      row.addEventListener('click', () => {
        if (row.dataset.all) {
          selected = multi ? [] : null;
        } else if (multi) {
          const v = row.dataset.value;
          selected = selected.includes(v) ? selected.filter(x => x !== v) : [...selected, v];
        } else {
          selected = row.dataset.value;
          mountEl.classList.remove('open');
        }
        updateToggleLabel();
        renderList();
        onChangeCb();
      });
    });
  }

  function updateToggleLabel() {
    if (multi) {
      toggle.textContent = selected.length === 0 ? allLabel : (selected.length === 1 ? selected[0] : `${selected.length} selected`);
    } else {
      const found = options.find(o => o.value === selected);
      toggle.textContent = selected === null ? allLabel : (found ? found.label : selected);
    }
  }

  return {
    setOptions(opts) { options = opts; renderList(); },
    getValue() { return multi ? (selected.length ? selected : null) : selected; },
    onChange(cb) { onChangeCb = cb; },
    reset() { selected = multi ? [] : null; updateToggleLabel(); renderList(); },
  };
}

function closeAllDropdowns() {
  document.querySelectorAll('.dd.open').forEach(el => el.classList.remove('open'));
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.dd')) closeAllDropdowns();
});

const storeDropdown = createDropdown({ mountEl: document.getElementById('ddStore'), placeholder: 'All stores', allLabel: 'All stores', multi: false });
const categoryDropdown = createDropdown({ mountEl: document.getElementById('ddCategory'), placeholder: 'All categories', allLabel: 'All categories', multi: true });
const subCategoryDropdown = createDropdown({ mountEl: document.getElementById('ddSubCategory'), placeholder: 'All sub-categories', allLabel: 'All sub-categories', multi: true });

// ---- Store list ----
async function loadStores() {
  const { data, error } = await supabase.from('store').select('store_code, store_name').order('store_name');
  if (error) { setStatus('Could not load the store list: ' + error.message, true); return; }
  storeDropdown.setOptions((data || []).map(s => ({ value: s.store_code, label: s.store_name })));
}

// ---- Category / Sub-Category lists ----
async function loadCategories() {
  const [catRes, subRes] = await Promise.all([
    supabase.rpc('get_distinct_categories'),
    supabase.rpc('get_distinct_sub_categories'),
  ]);
  if (!catRes.error) categoryDropdown.setOptions((catRes.data || []).map(c => ({ value: c.category, label: c.category })));
  if (!subRes.error) subCategoryDropdown.setOptions((subRes.data || []).map(c => ({ value: c.sub_category, label: c.sub_category })));
}

let reportType = 'store'; // 'store' | 'barcode' | 'sale_barcode'
let printType = 'excel';  // 'excel' | 'pdf'
let currentRows = [];
let currentSheetLabel = 'Report';
let currentIsSaleBarcodeShaped = false; // controls which column set Export uses

const els = {
  date: document.getElementById('asOfDate'),
  btnStore: document.getElementById('btnStore'),
  btnBarcode: document.getElementById('btnBarcode'),
  btnSaleBarcode: document.getElementById('btnSaleBarcode'),
  btnPrintTypeExcel: document.getElementById('btnPrintTypeExcel'),
  btnPrintTypePdf: document.getElementById('btnPrintTypePdf'),
  btnGenerate: document.getElementById('btnGenerate'),
  btnExport: document.getElementById('btnExport'),
  status: document.getElementById('statusLine'),
  results: document.getElementById('resultsArea'),
  stripe: document.getElementById('stripe'),
  search: document.getElementById('barcodeSearch'),
  searchStatus: document.getElementById('searchStatusLine'),
  searchResults: document.getElementById('searchResultsArea'),
};

els.date.value = new Date().toISOString().slice(0, 10);

// ---- Report type toggle ----
els.btnStore.addEventListener('click', () => setReportType('store'));
els.btnBarcode.addEventListener('click', () => setReportType('barcode'));
els.btnSaleBarcode.addEventListener('click', () => setReportType('sale_barcode'));
function setReportType(type) {
  reportType = type;
  els.btnStore.classList.toggle('active', type === 'store');
  els.btnBarcode.classList.toggle('active', type === 'barcode');
  els.btnSaleBarcode.classList.toggle('active', type === 'sale_barcode');
}

// ---- Print type toggle ----
els.btnPrintTypeExcel.addEventListener('click', () => setPrintType('excel'));
els.btnPrintTypePdf.addEventListener('click', () => setPrintType('pdf'));
function setPrintType(type) {
  printType = type;
  els.btnPrintTypeExcel.classList.toggle('active', type === 'excel');
  els.btnPrintTypePdf.classList.toggle('active', type === 'pdf');
  els.btnExport.textContent = type === 'excel' ? 'Export' : 'Print / Save PDF';
}

// ---- Generate report ----
els.btnGenerate.addEventListener('click', generateReport);

async function generateReport() {
  const asOfDate = els.date.value;
  if (!asOfDate) { setStatus('Pick a date first.', true); return; }
  const storeCode = storeDropdown.getValue();
  const categories = categoryDropdown.getValue();
  const subCategories = subCategoryDropdown.getValue();

  setLoading(true);
  setStatus('Running report…');
  els.btnExport.disabled = true;

  const fnMap = {
    store: 'get_store_wise_report',
    barcode: 'get_barcode_wise_report',
    sale_barcode: 'get_sale_barcode_wise_report',
  };
  const params = { as_of_date: asOfDate, p_store_code: storeCode, p_category: categories, p_sub_category: subCategories };
  if (reportType === 'sale_barcode') params.p_search = null;

  const { data, error } = await supabase.rpc(fnMap[reportType], params);

  setLoading(false);

  if (error) {
    setStatus('Report failed: ' + error.message, true);
    renderInto(els.results, null, 'Report failed', error.message);
    return;
  }

  currentRows = data || [];
  currentIsSaleBarcodeShaped = reportType === 'sale_barcode';
  currentSheetLabel = { store: 'Store Wise', barcode: 'Barcode Wise', sale_barcode: 'Sale_Barcode Wise' }[reportType];

  if (currentRows.length === 0) {
    setStatus(`No stock found for ${asOfDate}.`);
    renderInto(els.results, null, 'Nothing to show', 'No stock movement found for this date and store.');
    els.btnExport.disabled = true;
    return;
  }

  setStatus(`${currentRows.length} row${currentRows.length === 1 ? '' : 's'} — as of ${asOfDate}.`);
  renderInto(els.results, getColumns(reportType), null, null, currentRows);
  els.btnExport.disabled = false;
}

// ---- Independent Barcode Search module ----
let searchDebounce = null;
els.search.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(runBarcodeSearch, 350);
});
els.search.addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(searchDebounce); runBarcodeSearch(); } });
document.getElementById('btnSearchClear').addEventListener('click', () => {
  els.search.value = '';
  els.searchStatus.textContent = '';
  renderInto(els.searchResults, null, null, null, []);
});

async function runBarcodeSearch() {
  const term = els.search.value.trim();
  if (!term) { renderInto(els.searchResults, null, null, null, []); els.searchStatus.textContent = ''; return; }

  const asOfDate = els.date.value || new Date().toISOString().slice(0, 10);
  const storeCode = storeDropdown.getValue();

  els.searchStatus.textContent = 'Searching…';
  const { data, error } = await supabase.rpc('get_sale_barcode_wise_report', {
    as_of_date: asOfDate, p_store_code: storeCode, p_category: null, p_sub_category: null, p_search: term,
  });

  if (error) { els.searchStatus.textContent = 'Search failed: ' + error.message; return; }

  const rows = data || [];
  if (rows.length === 0) {
    els.searchStatus.textContent = `No matches for "${term}".`;
    renderInto(els.searchResults, null, 'No matches', `Nothing found for "${term}".`);
    return;
  }

  els.searchStatus.textContent = `${rows.length} match${rows.length === 1 ? '' : 'es'} for "${term}".`;
  renderInto(els.searchResults, getColumns('sale_barcode'), null, null, rows);

  // Search results become the active export/print target, so Export always
  // acts on whichever grid the user looked at most recently.
  currentRows = rows;
  currentIsSaleBarcodeShaped = true;
  currentSheetLabel = 'Barcode Search';
  els.btnExport.disabled = false;
}

// ---- Column definitions per report type ----
function getColumns(type) {
  const dateCol = [['report_date', 'Date', false]];
  const qtyCols = [
    ['opening_stock_qty', 'Opening Qty', true], ['on_hand_stock_qty', 'On Hand Qty', true],
    ['pending_stock_qty', 'Pending Qty', true], ['gross_stock_qty', 'Gross Qty', true],
  ];
  const valueCols = [
    ['opening_cost_value', 'Opening Cost Value', true], ['on_hand_cost_value', 'On Hand Cost Value', true],
    ['pending_cost_value', 'Pending Cost Value', true], ['gross_cost_value', 'Gross Cost Value', true],
    ['opening_sal_value', 'Opening Sale Value', true], ['on_hand_sal_value', 'On Hand Sale Value', true],
    ['pending_sal_value', 'Pending Sale Value', true], ['gross_sal_value', 'Gross Sale Value', true],
  ];

  if (type === 'store') {
    return [['store_name', 'Store', false], ...qtyCols, ...valueCols];
  }
  const itemCols = [...dateCol, ['store_name', 'Store', false], ['barcode', 'Barcode', false]];
  if (type === 'sale_barcode') itemCols.push(['sal_barcode', 'Sal Barcode', false]);
  itemCols.push(['user_barcode', 'User Barcode', false], ['category', 'Category', false], ['sub_category', 'Sub-Category', false], ['item_name', 'Item Name', false]);
  if (type === 'sale_barcode') itemCols.push(['cpu', 'CPU', true], ['mrp', 'MRP', true]);
  return [...itemCols, ...qtyCols, ...valueCols, ['stock_age_days', 'Stock Age (Days)', true]];
}

function renderInto(container, columns, headline, detail, rows) {
  if (headline) {
    container.innerHTML = `<div class="empty-state"><div class="headline">${headline}</div><div>${detail}</div></div>`;
    return;
  }
  if (!rows || rows.length === 0) { container.innerHTML = ''; return; }
  let html = '<div class="table-wrap"><table><thead><tr>';
  for (const [, label, isNum] of columns) html += `<th class="${isNum ? 'num' : ''}">${label}</th>`;
  html += '</tr></thead><tbody>';
  for (const row of rows) {
    html += '<tr>';
    for (const [key, , isNum] of columns) {
      const val = row[key];
      html += `<td class="${isNum ? 'num' : ''}">${isNum ? formatNumber(val) : (val ?? '')}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  container.innerHTML = html;
}

function formatNumber(val) {
  if (val === null || val === undefined) return '—';
  const n = Number(val);
  if (Number.isNaN(n)) return String(val);
  return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function setStatus(msg, isError = false) {
  els.status.textContent = msg;
  els.status.classList.toggle('error', isError);
}

function setLoading(isLoading) {
  els.btnGenerate.disabled = isLoading;
  els.stripe.classList.toggle('loading', isLoading);
}

// ---- Export (Excel) / Print (PDF view), driven by the Print Type toggle ----
els.btnExport.addEventListener('click', () => {
  if (currentRows.length === 0) return;
  if (printType === 'pdf') {
    window.print();
    return;
  }
  const ws = XLSX.utils.json_to_sheet(currentRows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, currentSheetLabel.slice(0, 31));
  const storeLabel = storeDropdown.getValue() || 'AllStores';
  XLSX.writeFile(wb, `StockReport_${currentSheetLabel.replace(/\s|_/g, '')}_${storeLabel}_${els.date.value}.xlsx`);
});
})();
</script>
